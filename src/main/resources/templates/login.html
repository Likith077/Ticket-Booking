<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Book My Ticket - Login</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Navbar */
.navbar-brand {
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 1.6rem;
}

/* Login Card */
.login-box {
    width: 100%;
    max-width: 430px;
    margin-top: 90px;
    background: rgba(255, 255, 255, 0.15);
    padding: 38px;
    border-radius: 15px;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

/* Input Fields */
.form-control {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
}

.form-control:focus {
    background: rgba(255,255,255,0.15);
    border-color: #ffd369;
    color: #fff;
    box-shadow: none;
}

/* Text Links */
a {
    text-decoration: none;
}

/* Toast Shadow */
.toast {
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
    <a class="navbar-brand" href="/">🎬 BookMyTicket</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div id="navMenu" class="collapse navbar-collapse justify-content-end">

        <!-- NOT LOGGED IN -->
        <div th:if="${session.user == null}">
            <a href="/login" class="btn btn-outline-light me-2">Login</a>
            <a href="/register" class="btn btn-warning">Register</a>
        </div>

        <!-- LOGGED IN -->
        <div th:if="${session.user != null}" class="d-flex align-items-center">
            <span class="text-white me-3" th:text="'Hello, ' + ${session.user.name}"></span>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>

    </div>
</nav>

<!-- TOASTS -->
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3">

        <!-- SUCCESS TOAST -->
        <div th:if="${pass}" class="toast bg-success text-white border-0">
            <div class="toast-header bg-success text-white">
                <strong class="me-auto">Success</strong>
                <button class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" th:text="${pass}"></div>
        </div>

        <!-- ERROR TOAST -->
        <div th:if="${fail}" class="toast bg-danger text-white border-0">
            <div class="toast-header bg-danger text-white">
                <strong class="me-auto">Error</strong>
                <button class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" th:text="${fail}"></div>
        </div>

    </div>
</div>

<!-- LOGIN BOX -->
<div class="container d-flex justify-content-center">
    <div class="login-box">

        <h3 class="text-center mb-4 fw-bold">Login</h3>

        <form action="/login" method="post">

            <div class="mb-3 text-start">
                <label class="form-label text-white">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label text-white">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-warning w-100 mt-2 fw-semibold">Login</button>

            <div class="text-center mt-3">
                <small class="text-white">
                    Don't have an account?
                    <a href="/register" class="text-warning">Register</a>
                </small>
            </div>

        </form>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto-show toast -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.toast').forEach(t => new bootstrap.Toast(t).show());
});
</script>

</body>
</html>
